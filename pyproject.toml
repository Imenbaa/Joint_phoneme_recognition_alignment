[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reco_align"
version = "0.1.0"
description = "Joint phone recognition and alignment with wav2vec2 (CTC + cross-attention aligner)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

[project.scripts]
reco-align-transcribe = "reco_align.transcribe_cli:main"

[tool.setuptools]
packages = ["reco_align", "reco_align.evaluation"]
