[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reco_align"
version = "0.1.0"
description = "Joint phone recognition and alignment with wav2vec2 (CTC + cross-attention aligner)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
# Inference and evaluation (reco-align-transcribe, evaluate.py). The exact versions used to train the
# models are in requirements.txt.
dependencies = [
    "torch>=2.1",
    "torchaudio>=2.1",
    "transformers>=4.41",
    "numpy",
    "soundfile",
    "librosa",
    "pandas",
    "Levenshtein",
    "jiwer",
    "silero-vad>=6.2",
]

[project.optional-dependencies]
# Training (train_ctc.py, train_aligner.py).
train = ["datasets", "accelerate", "editdistance", "tensorboard"]

[project.scripts]
reco-align-transcribe = "reco_align.transcribe_cli:main"

[tool.setuptools]
packages = ["reco_align", "reco_align.evaluation"]
